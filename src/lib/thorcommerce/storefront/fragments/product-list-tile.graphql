fragment ProductListTile on Product {
	id
	name
	slug
	heroVariant {
		id
		image {
			src
		}
	}
	colorVariants: variants(first: 100) {
		edges {
			node {
				id
				image {
					src
				}
				price {
					...Price
				}
				selectedAttributes {
					attribute {
						name
					}
					attributeValue {
						id
						value
					}
				}
			}
		}
	}
	priceRange {
		minPrice {
			...Price
		}
		maxPrice {
			...Price
		}
	}
}
